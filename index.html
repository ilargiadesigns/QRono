<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QRono</title>
<meta name="theme-color" content="#EA580C">
<link rel="icon" href="qrono-app-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="qrono-app-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@1,8..60,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* QRono · © 2026 Joan Cuevas · Todos los derechos reservados
   Layout: columna única estrecha; tres modos (empleado, kiosco, encargado) según ?m= */
:root{
  --bg:#FBF1E7; --surface:#FFFFFF; --ink:#151311; --muted:#6E625A; --line:#EBDCCF;
  --brand:#EA580C; --brand-ink:#FFFFFF; --soft:#FDE8D4; --go:#16803A; --warn:#B45309; --bad:#B42318;
  --f-display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#151311; --surface:#1F1B18; --ink:#F5EDE6; --muted:#A8998D; --line:#352D27;
  --brand:#F26B1D; --brand-ink:#1A0D04; --soft:#3A2414; --go:#3FB56A; --warn:#E3A14A; --bad:#F2765F;
  color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:max(18px,env(safe-area-inset-top,0px));padding-bottom:max(32px,env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:inherit}
.logo svg{width:38px;height:28px}
.word{font-family:var(--f-display);font-style:italic;font-weight:700;font-size:26px;letter-spacing:-.01em;line-height:1}
.word b{color:var(--brand);font-weight:700}
.co{font-size:13px;color:var(--muted);text-align:right;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--f-display);font-style:italic;font-size:22px;margin:0;line-height:1.2;text-wrap:balance}
.label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} p{margin:0}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:14px}
input,select{font:500 16px var(--f-body);padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-width:0}
.btn{font:600 16px var(--f-body);border-radius:12px;padding:13px 16px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;width:100%}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.small{font-size:13px;padding:7px 10px;width:auto;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:is(.btn,input,select,a):focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>.only{grid-column:1/-1}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;padding:5px 11px;border-radius:999px;background:var(--soft)}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.in::before{background:var(--go)} .pill.pause::before{background:var(--warn)} .pill.bad{color:var(--bad)} .pill.bad::before{background:var(--bad)}
.big{font-family:var(--f-display);font-style:italic;font-weight:700;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.notice{border-radius:12px;padding:12px 14px;font-weight:500;border:1px solid var(--line)}
.notice.ok{border-color:var(--go);color:var(--go)} .notice.bad{border-color:var(--bad);color:var(--bad)}
.notice small{display:block;font-weight:400;color:var(--muted);margin-top:2px}
.list{display:flex;flex-direction:column}
.list .it{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.list .it:last-child{border-bottom:0}
/* kiosco */
.clock{font-family:var(--f-display);font-style:italic;font-weight:700;font-size:60px;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.date{text-align:center;color:var(--muted);margin-top:-6px}
.qrbox{align-self:center;background:#FFFFFF;padding:14px;border-radius:14px;width:min(380px,100%);aspect-ratio:1;max-width:100%;display:grid;place-items:center}
.qrbox img,.qrbox canvas{width:100%!important;height:auto!important;display:block}
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);transform-origin:left;transition:transform .25s linear}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font:12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
/* encargado */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{font:600 14px var(--f-body);border:0;border-radius:9px;padding:9px 4px;background:transparent;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--brand);color:var(--brand-ink)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:440px}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:8px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
td.mono{font:11.5px var(--f-mono);color:var(--muted)}
tr.broken td{color:var(--bad)}
.copy{display:flex;gap:8px;align-items:center}
.copy code{flex:1;min-width:0;overflow-wrap:anywhere;font:12px var(--f-mono);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
footer{font-size:12px;color:var(--muted);text-align:center}
@media (max-width:420px){.grid2{grid-template-columns:1fr}.clock{font-size:48px}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="#" aria-label="QRono">
      <svg viewBox="235 48 530 395" aria-hidden="true"><g fill="none" stroke="#EA580C" stroke-linecap="round" stroke-linejoin="round"><path d="M268 393 A232 232 0 0 1 732 393" stroke-width="34"/><path d="M500 157 V119" stroke-width="38"/><rect x="430" y="80" width="140" height="58" rx="17" fill="#EA580C" stroke="none"/><path d="M668 204 L693 176" stroke-width="30"/><path d="M687 164 L728 197" stroke-width="35"/><path d="M500 364 L608 262" stroke-width="24"/></g><circle cx="500" cy="364" r="29" fill="#16803A"/></svg>
      <span class="word"><b>QR</b>ono</span>
    </a>
    <span class="co" id="coName"></span>
  </header>
  <main id="app" class="wrap" style="gap:16px"></main>
  <footer>QRono · Joan Cuevas</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ================= CONFIGURACIÓN =================
   Supabase > Project Settings: copia la URL del proyecto y la clave pública
   ("publishable", sb_publishable_…, o la "anon" antigua, eyJ…).
   Es pública por diseño: la seguridad está en las funciones del servidor. */
const SUPABASE_URL = "https://dzemxnlkjoapkprhtbxv.supabase.co";      // p. ej. https://abcdxyz.supabase.co
const SUPABASE_ANON_KEY = "sb_publishable_HYm7VuPzD8T8uMukM1PYJA_bl6aZfcs";
/* ================================================= */

const STEP = 10000;
const KINDS = {entrada:"Entrada", salida:"Salida", "pausa-ini":"Inicio de pausa", "pausa-fin":"Fin de pausa"};
const qs = new URLSearchParams(location.search);
const CID = qs.get("c");
const MODE = qs.get("m") || "emp";
const app = document.getElementById("app");
const pad = n => String(n).padStart(2,"0");
const hm = t => { const d=new Date(t); return pad(d.getHours())+":"+pad(d.getMinutes()); };
const hms = t => { const d=new Date(t); return hm(d)+":"+pad(d.getSeconds()); };
const minsTxt = m => Math.floor(m/60)+" h "+pad(m%60)+" min";
const windowNow = () => Math.floor(Date.now()/STEP);
const baseUrl = () => location.origin + location.pathname;

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(k==="class") e.className=v; else if(k.startsWith("on")) e.addEventListener(k.slice(2),v);
    else if(v!==false && v!=null) e.setAttribute(k, v===true?"":v);
  }
  for(const k of kids.flat()) if(k!=null && k!==false) e.append(k instanceof Node?k:String(k));
  return e;
}
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
async function rpc(fn, args){
  let r;
  try{
    const headers = {apikey:SUPABASE_ANON_KEY, "Content-Type":"application/json"};
    // Clave "anon" antigua (JWT, empieza por eyJ): también va en Authorization.
    // Clave "publishable" nueva (sb_publishable_…): solo en apikey.
    if(SUPABASE_ANON_KEY.startsWith("eyJ")) headers.Authorization = "Bearer "+SUPABASE_ANON_KEY;
    r = await fetch(SUPABASE_URL.replace(/\/+$/,"")+"/rest/v1/rpc/"+fn, {method:"POST", headers, body:JSON.stringify(args)});
  }catch(e){ throw new Error("Sin conexión. Comprueba los datos o el WiFi y vuelve a intentarlo."); }
  const j = await r.json().catch(()=>null);
  if(!r.ok) throw new Error((j && j.message) || "Error del servidor ("+r.status+").");
  if(j && j.ok===false) throw new Error(j.error);
  return j;
}
function notice(kind, text, small){ return el("div",{class:"notice "+kind}, text, small?el("small",{},small):null); }
function render(...nodes){ app.replaceChildren(...nodes); }

/* ---------------- arranque ---------------- */
async function start(){
  if(!SUPABASE_URL || !SUPABASE_ANON_KEY){
    return render(el("section",{class:"panel"}, el("h2",{},"Falta conectar la base de datos"),
      el("p",{class:"muted"},"Abre index.html y rellena SUPABASE_URL y SUPABASE_ANON_KEY con los datos de tu proyecto de Supabase.")));
  }
  if(!CID){
    return render(el("section",{class:"panel"}, el("h2",{},"Abre el enlace de tu empresa"),
      el("p",{class:"muted"},"Escanea el QR del kiosco o usa el enlace que te ha dado tu encargado.")));
  }
  if(MODE==="kiosk") return kiosk();
  if(MODE==="admin"){
    rpc("qr_company_info",{p_company:CID}).then(i=>{ if(i) document.getElementById("coName").textContent=i.name; }).catch(()=>{});
    return admin();
  }
  return employee();
}

/* ================= EMPLEADO ================= */
let pendingCode = null;
function readHash(){
  const h = decodeURIComponent((location.hash||"").slice(1));
  if(/^f-\d+-[0-9a-f]{10}$/.test(h)){
    pendingCode = {code:h, w:+h.split("-")[1], at:Date.now()};
    try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){}
  }
}
const codeFresh = () => pendingCode && pendingCode.w >= windowNow()-3;

async function employee(){
  readHash();
  if(!window._hashBound){ window._hashBound=true; window.addEventListener("hashchange", ()=>{ readHash(); employee(); }); }
  const key = "qrono:"+CID;
  const me = store.get(key);
  let info;
  try{ info = await rpc("qr_company_info",{p_company:CID}); }
  catch(e){ return render(notice("bad", e.message)); }
  if(!info){ return render(notice("bad","Este enlace no corresponde a ninguna empresa.")); }
  document.getElementById("coName").textContent = info.name;

  if(!me || !me.employee || !me.device || !info.employees.some(x=>x.id===me.employee)){
    const sel = el("select",{id:"empSel"}, el("option",{value:""},"Elige tu nombre"),
      info.employees.map(x=>el("option",{value:x.id},x.name)));
    const pin = el("input",{id:"pin",type:"password",inputmode:"numeric",autocomplete:"off",placeholder:"····"});
    const msg = el("div");
    const go = el("button",{class:"btn primary",onclick:async()=>{
      if(!sel.value || !pin.value){ msg.replaceChildren(notice("bad","Elige tu nombre y escribe tu PIN.")); return; }
      go.disabled = true;
      const bytes = crypto.getRandomValues(new Uint8Array(24));
      const device = [...bytes].map(b=>b.toString(16).padStart(2,"0")).join("");
      try{
        await rpc("qr_pair_device",{p_company:CID,p_employee:sel.value,p_pin:pin.value,p_device:device});
        store.set(key,{employee:sel.value,device});
        employee();
      }catch(e){ msg.replaceChildren(notice("bad",e.message)); go.disabled=false; }
    }},"Vincular este móvil");
    return render(el("section",{class:"panel"},
      el("h2",{},"Identifícate una vez"),
      el("p",{class:"muted"},"Este móvil quedará vinculado a tu nombre. La próxima vez solo tendrás que escanear el QR."),
      el("label",{class:"f"},"Nombre",sel), el("label",{class:"f"},"PIN",pin), msg, go,
      pendingCode ? el("p",{class:"muted"},"Tienes un QR escaneado: después de vincular podrás fichar.") : null));
  }

  const name = (info.employees.find(x=>x.id===me.employee)||{}).name;
  const stateBox = el("div"), msg = el("div"), actions = el("div",{class:"grid2"});
  const panel = el("section",{class:"panel"},
    el("div",{class:"row",style:"justify-content:space-between"}, el("h2",{},name), el("span",{class:"pill",id:"pill"},"…")),
    el("div",{}, el("div",{class:"label"},"Trabajado hoy"), el("div",{class:"big",id:"worked"},"—")),
    msg, actions, stateBox);
  render(panel, el("p",{class:"muted",style:"font-size:13px;text-align:center"},
    "¿Cambias de móvil? Pide al encargado que libere el vinculado."));

  let day;
  function draw(){
    const pill=document.getElementById("pill");
    const st=day.state;
    pill.className="pill"+(st==="dentro"?" in":st==="pausa"?" pause":"");
    pill.textContent = st==="dentro"?"Dentro":st==="pausa"?"En pausa":"Fuera";
    document.getElementById("worked").textContent = minsTxt(day.worked_min);
    const fresh = codeFresh();
    if(!msg.dataset.keep) msg.replaceChildren(fresh
      ? notice("ok","QR leído","Elige qué quieres registrar.")
      : notice("", "Escanea el QR del kiosco con la cámara del móvil para fichar."));
    const opts = st==="fuera"?[["entrada",1]]:st==="pausa"?[["pausa-fin",1]]:[["salida",1],["pausa-ini",0]];
    actions.replaceChildren(...opts.map(([k,p],i,a)=>el("button",{class:"btn"+(p?" primary":"")+(a.length===1?" only":""),
      disabled:!fresh, onclick:()=>punch(k)}, k==="pausa-fin"?"Volver de la pausa":k==="pausa-ini"?"Empezar pausa":"Fichar "+KINDS[k].toLowerCase())));
    stateBox.replaceChildren(...(day.today.length ? [el("div",{},
      el("div",{class:"label"},"Hoy"),
      el("div",{class:"list"}, day.today.map(p=>el("div",{class:"it"}, el("span",{},KINDS[p.kind]), el("span",{class:"muted"},hm(p.ts))))))] : []));
  }
  async function load(){
    try{ day = await rpc("qr_status",{p_company:CID,p_employee:me.employee,p_device:me.device}); draw(); }
    catch(e){
      if(/no está vinculado/.test(e.message)){ store.del(key); return employee(); }
      msg.replaceChildren(notice("bad",e.message));
    }
  }
  async function punch(kind){
    actions.querySelectorAll("button").forEach(b=>b.disabled=true);
    try{
      day = await rpc("qr_punch",{p_company:CID,p_employee:me.employee,p_device:me.device,p_code:pendingCode.code,p_kind:kind});
      pendingCode=null; msg.dataset.keep="1";
      msg.replaceChildren(notice("ok",KINDS[kind]+" registrada a las "+hm(Date.now()),"Guardada con su huella en el registro de la empresa."));
      setTimeout(()=>{ delete msg.dataset.keep; draw(); },8000);
      draw();
    }catch(e){ pendingCode=null; msg.dataset.keep="1"; msg.replaceChildren(notice("bad",e.message)); setTimeout(()=>{ delete msg.dataset.keep; draw(); },8000); draw(); }
  }
  await load();
  clearInterval(window._empTimer);
  let ticks=0;
  window._empTimer = setInterval(()=>{ if(!day) return; if(++ticks%60===0 && day.state!=="fuera") load(); else draw(); },1000);
}

/* ================= KIOSCO ================= */
async function hmacHex(secret,msg){
  const k = await crypto.subtle.importKey("raw",new TextEncoder().encode(secret),{name:"HMAC",hash:"SHA-256"},false,["sign"]);
  const s = await crypto.subtle.sign("HMAC",k,new TextEncoder().encode(msg));
  return [...new Uint8Array(s)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
async function kiosk(){
  const key="qrono-kiosk:"+CID;
  const saved=store.get(key);
  if(!saved || !saved.secret){
    const pin=el("input",{id:"kpin",type:"password",inputmode:"numeric",placeholder:"PIN del encargado"});
    const msg=el("div");
    const go=el("button",{class:"btn primary",onclick:async()=>{
      go.disabled=true;
      try{ const r=await rpc("qr_kiosk_pair",{p_company:CID,p_admin_pin:pin.value}); store.set(key,{secret:r.secret,name:r.name}); kiosk(); }
      catch(e){ msg.replaceChildren(notice("bad",e.message)); go.disabled=false; }
    }},"Activar kiosco");
    return render(el("section",{class:"panel"}, el("h2",{},"Activar este dispositivo como kiosco"),
      el("p",{class:"muted"},"Solo se hace una vez. Después el QR funciona aunque se corte el WiFi un rato."),
      el("label",{class:"f"},"PIN del encargado",pin), msg, go));
  }
  document.getElementById("coName").textContent = saved.name;
  const qrBox=el("div",{class:"qrbox",id:"qr","aria-label":"QR de fichaje"});
  const bar=el("i"), win=el("span"), left=el("span"), clock=el("div",{class:"clock"}), date=el("div",{class:"date"});
  render(el("section",{class:"panel"}, clock, date, qrBox, el("div",{class:"bar"},bar), el("div",{class:"meta"},win,left),
      el("p",{style:"text-align:center;font-weight:500"},"Escanea con la cámara de tu móvil para fichar"),
      el("div",{class:"grid2"},
        el("button",{class:"btn",onclick:async()=>{ try{await document.documentElement.requestFullscreen();}catch(e){} try{await navigator.wakeLock.request("screen");}catch(e){} }},"Pantalla completa"),
        el("button",{class:"btn",onclick:()=>{ store.del(key); kiosk(); }},"Desactivar kiosco"))));
  let qr=null, lastW=null;
  try{ await navigator.wakeLock.request("screen"); }catch(e){}
  async function tick(){
    const now=new Date(), w=windowNow();
    clock.textContent=hms(now);
    date.textContent=now.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"});
    bar.style.transform="scaleX("+(1-(Date.now()%STEP)/STEP)+")";
    left.textContent="cambia en "+Math.ceil((STEP-Date.now()%STEP)/1000)+" s";
    if(w!==lastW){
      lastW=w;
      const sig=(await hmacHex(saved.secret, CID+":"+w)).slice(0,10);
      const url=baseUrl()+"?c="+CID+"#f-"+w+"-"+sig;
      win.textContent="Franja "+w.toLocaleString("es-ES");
      if(!qr) qr=new QRCode(qrBox,{text:url,width:512,height:512,colorDark:"#151311",colorLight:"#FFFFFF",correctLevel:QRCode.CorrectLevel.M});
      else qr.makeCode(url);
    }
  }
  clearInterval(window._kTimer); window._kTimer=setInterval(tick,250); tick();
}

/* ================= ENCARGADO ================= */
let ADMIN_PIN=null;
async function admin(){
  if(!ADMIN_PIN){
    const pin=el("input",{id:"apin",type:"password",inputmode:"numeric",placeholder:"····"});
    const msg=el("div");
    const go=el("button",{class:"btn primary",onclick:async()=>{
      go.disabled=true;
      try{ await rpc("qr_admin_verify",{p_company:CID,p_admin_pin:pin.value}); ADMIN_PIN=pin.value; admin(); }
      catch(e){ msg.replaceChildren(notice("bad",e.message)); go.disabled=false; }
    }},"Entrar");
    return render(el("section",{class:"panel"}, el("h2",{},"Panel del encargado"), el("label",{class:"f"},"PIN del encargado",pin), msg, go));
  }
  const tabs=["Registro","Empleados","Enlaces"]; let current=window._aTab||"Registro";
  const body=el("div",{class:"wrap",style:"gap:16px;max-width:none"});
  const bar=el("div",{class:"tabs",role:"tablist"}, tabs.map(t=>el("button",{role:"tab","aria-selected":String(t===current),onclick:()=>{window._aTab=t;admin();}},t)));
  render(bar, body);
  const A = (fn,extra={}) => rpc(fn,Object.assign({p_company:CID,p_admin_pin:ADMIN_PIN},extra));
  if(current==="Registro") return adminLog(body,A);
  if(current==="Empleados") return adminEmployees(body,A);
  return adminLinks(body);
}
async function adminLog(body,A){
  const today=new Date(), iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  const from=el("input",{type:"date",id:"from",value:window._aFrom||iso(today)}), to=el("input",{type:"date",id:"to",value:window._aTo||iso(today)});
  const chain=el("span",{class:"pill"},"Comprobando cadena…"), tbody=el("tbody"), count=el("span",{class:"muted",style:"font-size:13px"});
  let rows=[];
  const csv=el("button",{class:"btn small",onclick:()=>{
    const lines=[["id","empleado","tipo","fecha","hora","franja_qr","huella"].join(";")].concat(rows.map(r=>{const d=new Date(r.ts);
      return [r.id,'"'+r.employee.replace(/"/g,'""')+'"',KINDS[r.kind],iso(d),hms(d),r.window,r.hash].join(";");}));
    const blob=new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
    const a=el("a",{href:URL.createObjectURL(blob),download:"fichajes_"+from.value+"_"+to.value+".csv"}); document.body.append(a); a.click(); a.remove();
  }},"Descargar CSV");
  const reload=async()=>{
    window._aFrom=from.value; window._aTo=to.value;
    try{
      const r=await A("qr_admin_punches",{p_from:from.value,p_to:to.value}); rows=r.rows;
      tbody.replaceChildren(...[...rows].reverse().map(p=>{const d=new Date(p.ts);
        return el("tr",{"data-id":p.id}, el("td",{},d.toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit"})+" "+hm(d)), el("td",{},p.employee), el("td",{},KINDS[p.kind]), el("td",{class:"mono"},p.hash.slice(0,8)));}));
      if(!rows.length) tbody.replaceChildren(el("tr",{},el("td",{colspan:"4",class:"muted"},"No hay fichajes en estas fechas.")));
      count.textContent=rows.length+" fichajes";
    }catch(e){ tbody.replaceChildren(el("tr",{},el("td",{colspan:"4"},notice("bad",e.message)))); }
  };
  from.addEventListener("change",reload); to.addEventListener("change",reload);
  body.append(el("section",{class:"panel"},
    el("div",{class:"row",style:"justify-content:space-between"}, chain, csv),
    el("div",{class:"grid2"}, el("label",{class:"f"},"Desde",from), el("label",{class:"f"},"Hasta",to)),
    count,
    el("div",{class:"tablewrap"}, el("table",{}, el("thead",{},el("tr",{},["Fecha","Empleado","Tipo","Huella"].map(h=>el("th",{},h)))), tbody)),
    el("p",{class:"muted",style:"font-size:13px"},"Los fichajes no se pueden editar ni borrar. Cada uno guarda la huella del anterior: si alguien tocara la base de datos, la cadena aparecería rota.")));
  await reload();
  try{
    const v=await A("qr_admin_verify");
    if(v.intact){ chain.className="pill in"; chain.textContent="Cadena íntegra · "+v.count; }
    else{ chain.className="pill bad"; chain.textContent="Cadena rota en el fichaje "+v.broken_id;
      tbody.querySelectorAll("tr[data-id]").forEach(tr=>{ if(+tr.dataset.id>=v.broken_id) tr.className="broken"; }); }
  }catch(e){ chain.className="pill bad"; chain.textContent=e.message; }
}
async function adminEmployees(body,A){
  const list=el("div",{class:"list"}), msg=el("div");
  const name=el("input",{id:"nname",placeholder:"Nombre y apellido"}), pin=el("input",{id:"npin",inputmode:"numeric",placeholder:"4 a 8 cifras"});
  const load=async()=>{
    try{
      const r=await A("qr_admin_employees");
      list.replaceChildren(...r.rows.map(e=>el("div",{class:"it"},
        el("div",{style:"min-width:0"}, el("div",{style:"font-weight:600"+(e.active?"":";opacity:.5")},e.name),
          el("div",{class:"muted",style:"font-size:13px"}, !e.active?"De baja":e.device?"Móvil vinculado":"Sin móvil vinculado")),
        el("div",{class:"row",style:"justify-content:flex-end"},
          e.device && e.active ? el("button",{class:"btn small",onclick:()=>act(e.id,"reset-device")},"Liberar móvil") : null,
          el("button",{class:"btn small",onclick:()=>act(e.id,e.active?"deactivate":"activate")},e.active?"Dar de baja":"Reactivar")))));
      if(!r.rows.length) list.replaceChildren(el("p",{class:"muted"},"Todavía no hay empleados. Añade el primero abajo."));
    }catch(e){ msg.replaceChildren(notice("bad",e.message)); }
  };
  const act=async(id,action)=>{ try{ await A("qr_admin_update_employee",{p_employee:id,p_action:action}); load(); }catch(e){ msg.replaceChildren(notice("bad",e.message)); } };
  const add=el("button",{class:"btn primary",onclick:async()=>{
    try{ await A("qr_admin_add_employee",{p_name:name.value,p_pin:pin.value});
      msg.replaceChildren(notice("ok",name.value+" añadido","Dale su PIN en persona: lo usará una vez para vincular su móvil."));
      name.value=""; pin.value=""; load(); }
    catch(e){ msg.replaceChildren(notice("bad",e.message)); }
  }},"Añadir empleado");
  body.append(el("section",{class:"panel"}, el("h2",{},"Equipo"), list),
    el("section",{class:"panel"}, el("h2",{},"Nuevo empleado"),
      el("div",{class:"grid2"}, el("label",{class:"f"},"Nombre",name), el("label",{class:"f"},"PIN",pin)), msg, add));
  load();
}
function adminLinks(body){
  const link=(title,desc,url)=>{
    const code=el("code",{},url), status=el("span",{class:"muted",style:"font-size:13px"});
    return el("section",{class:"panel"}, el("h2",{},title), el("p",{class:"muted"},desc),
      el("div",{class:"copy"}, code, el("button",{class:"btn small",onclick:async()=>{
        try{ await navigator.clipboard.writeText(url); status.textContent="Copiado"; }
        catch(e){ const r=document.createRange(); r.selectNodeContents(code); const s=getSelection(); s.removeAllRanges(); s.addRange(r); status.textContent="Selecciónalo y copia"; }
      }},"Copiar")), status);
  };
  body.append(
    link("Kiosco","Ábrelo en la tablet de la entrada y actívalo con tu PIN.", baseUrl()+"?c="+CID+"&m=kiosk"),
    link("Empleados","Los empleados no necesitan este enlace: basta con escanear el QR del kiosco. Sirve para guardarlo en favoritos.", baseUrl()+"?c="+CID),
    link("Panel del encargado","Guárdalo solo tú.", baseUrl()+"?c="+CID+"&m=admin"));
}

start();
